packages:
  - apps/*

allowBuilds:
  '@clerk/shared': false
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false

auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg

minimumReleaseAgeExclude:
  - brace-expansion@1.1.17
  - brace-expansion@2.1.3
  - '@expo/cli@54.0.26'
  - '@expo/config-plugins@54.0.5'
  - '@expo/config@12.0.14'
  - '@expo/env@2.0.12'
  - '@expo/metro-config@54.0.17'
  - '@expo/prebuild-config@54.0.9'
  - '@expo/schema-utils@0.1.9'
  - babel-preset-expo@54.0.12
  - expo@54.0.36

overrides:
  brace-expansion@1.1.13: 1.1.17
  brace-expansion@2.1.0: 2.1.3
  brace-expansion@5.0.5: 5.0.8
  eslint-plugin-react-hooks@7.1.1: 7.0.1
  js-yaml@3.14.2: 3.15.0
  js-yaml@4.1.1: 4.3.0
  postcss@8.4.31: 8.5.18
  postcss@8.4.49: 8.5.18
  sharp@0.34.5: 0.35.0
  shell-quote: 1.9.0
  tar@7.5.15: 7.5.21
  undici: 6.27.0
  ws: 8.21.0
